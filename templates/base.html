<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{% block title %}SDOC{% endblock %} · SDOC</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="topbar"><div class="inner">
  <a class="brand" href="/"><span class="dot"></span>SDOC · SI vs BL verification</a>
  <nav>
    <a href="/" {% if nav == 'home' %}class="active"{% endif %}>Dashboard</a>
    <a href="/cases" {% if nav == 'cases' %}class="active"{% endif %}>Cases</a>
    <a href="/review" {% if nav == 'review' %}class="active"{% endif %}>Review queue</a>
    <a href="/api/submission">submission.json</a>
    <a href="/docs">API</a>
  </nav>
</div></div>
<main>{% block content %}{% endblock %}</main>
<footer>Averis × Monash Hackathon 2026 · FastAPI on Cloud Run · Firestore · Cloud Storage · Gemini on Vertex AI · verifies SI/BL consistency, not document authenticity.</footer>
</body>
</html>
